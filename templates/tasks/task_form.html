{% extends "base.html" %}

{% block title %}Task Form | ProjectFlow{% endblock %}

{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Task setup</p>
        <h1>{% if object %}Edit Task{% else %}New Task{% endif %}</h1>
        <p class="page-subtitle">Assign work, set priority, and keep delivery dates visible.</p>
    </div>
</section>

<section class="form-shell">
    <form method="post" enctype="multipart/form-data" class="form-card form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="button primary" type="submit">Save Task</button>
            <a class="button ghost" href="{% url 'tasks:list' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
