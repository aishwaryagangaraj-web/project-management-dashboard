{% extends "base.html" %}

{% block title %}Delete Task | ProjectFlow{% endblock %}

{% block content %}
<section class="confirm-card danger-zone">
    <p class="eyebrow">Danger zone</p>
    <h1>Delete {{ object.title }}?</h1>
    <p>This removes the task from {{ object.project.name }}. This action cannot be undone.</p>
    <form method="post" class="actions">
        {% csrf_token %}
        <button class="button danger" type="submit">Delete Task</button>
        <a class="button ghost" href="{{ object.get_absolute_url }}">Cancel</a>
    </form>
</section>
{% endblock %}
