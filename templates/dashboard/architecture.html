{% extends "base.html" %}

{% block title %}Architecture | ProjectFlow{% endblock %}

{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">System architecture</p>
        <h1>ProjectFlow architecture</h1>
        <p class="page-subtitle">A compact view of the main application layers and services.</p>
    </div>
</section>

<section class="card architecture-card">
    <svg viewBox="0 0 1200 640" role="img" aria-label="ProjectFlow architecture diagram">
        <defs>
            <linearGradient id="archNode" x1="0" x2="1">
                <stop offset="0%" stop-color="#2563eb" />
                <stop offset="100%" stop-color="#7c3aed" />
            </linearGradient>
        </defs>
        <rect x="20" y="20" width="1160" height="600" rx="24" fill="#0f172a" />
        <rect x="60" y="70" width="220" height="90" rx="18" fill="url(#archNode)" />
        <text x="170" y="118" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Browser / UI</text>
        <text x="170" y="142" text-anchor="middle" fill="#dbeafe" font-size="14">Landing, dashboard, kanban</text>

        <rect x="360" y="70" width="220" height="90" rx="18" fill="#111c31" stroke="#334155" />
        <text x="470" y="118" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Django Views</text>
        <text x="470" y="142" text-anchor="middle" fill="#cbd5e1" font-size="14">Templates, RBAC, exports</text>

        <rect x="660" y="70" width="220" height="90" rx="18" fill="#111c31" stroke="#334155" />
        <text x="770" y="118" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">DRF API</text>
        <text x="770" y="142" text-anchor="middle" fill="#cbd5e1" font-size="14">JWT auth, CRUD, Swagger</text>

        <rect x="960" y="70" width="180" height="90" rx="18" fill="#111c31" stroke="#334155" />
        <text x="1050" y="118" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Render</text>
        <text x="1050" y="142" text-anchor="middle" fill="#cbd5e1" font-size="14">Deployment target</text>

        <line x1="280" y1="115" x2="360" y2="115" stroke="#93c5fd" stroke-width="5" />
        <line x1="580" y1="115" x2="660" y2="115" stroke="#93c5fd" stroke-width="5" />
        <line x1="880" y1="115" x2="960" y2="115" stroke="#93c5fd" stroke-width="5" />

        <rect x="120" y="250" width="250" height="110" rx="18" fill="#111c31" stroke="#334155" />
        <text x="245" y="295" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">SQLite / Postgres</text>
        <text x="245" y="320" text-anchor="middle" fill="#cbd5e1" font-size="14">Projects, tasks, comments, notifications</text>

        <rect x="430" y="250" width="250" height="110" rx="18" fill="#111c31" stroke="#334155" />
        <text x="555" y="295" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Email + Scheduler</text>
        <text x="555" y="320" text-anchor="middle" fill="#cbd5e1" font-size="14">SMTP reminders and assignment alerts</text>

        <rect x="740" y="250" width="250" height="110" rx="18" fill="#111c31" stroke="#334155" />
        <text x="865" y="295" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">ReportLab PDF</text>
        <text x="865" y="320" text-anchor="middle" fill="#cbd5e1" font-size="14">Exports for projects, tasks, analytics</text>

        <line x1="245" y1="160" x2="245" y2="250" stroke="#334155" stroke-width="4" />
        <line x1="555" y1="160" x2="555" y2="250" stroke="#334155" stroke-width="4" />
        <line x1="865" y1="160" x2="865" y2="250" stroke="#334155" stroke-width="4" />

        <rect x="120" y="440" width="1030" height="120" rx="22" fill="#050b16" stroke="#334155" />
        <text x="635" y="490" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Security, logging, validation, and responsive UI polish across the stack</text>
        <text x="635" y="525" text-anchor="middle" fill="#cbd5e1" font-size="15">Auth, RBAC, file validation, custom errors, theme support, and production deployment compatibility.</text>
    </svg>
</section>
{% endblock %}
